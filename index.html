<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        </style>

        <style>
        /* Readability + legend overrides, added 2026-11-10 */
        #popup-content {
            font-size: 15px;
            line-height: 1.35;
        }
        #popup-content>ul>li>a {
            font-size: 15.5px;
        }
        #popup-content>table {
            font-size: 14.5px;
        }
        #popup-content td ul.desc {
            list-style-type: disc;
            padding-left: 1.2em;
            margin: 0;
        }
        #popup-content td ul.desc li {
            margin-bottom: 0.35em;
        }
        .ol-overlay-container {
            z-index: 1100;
        }
        /* Let the OpenLayers overlay container wrap the popup so its
           bottom-center anchoring applies (absolute children don't size it). */
        .ol-popup {
            position: static;
        }
        #legend {
            position: absolute;
            left: 8px;
            bottom: 36px;
            z-index: 1000;
            background: rgba(255,255,255,0.92);
            border-radius: 8px;
            padding: 8px 12px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.35);
            font-family: sans-serif;
            font-size: 13px;
            line-height: 1.5;
            color: #172033;
            max-width: 46vw;
            max-height: 42vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        #legend .legend-title {
            font-weight: bold;
            font-size: 13.5px;
            margin-bottom: 2px;
        }
        #legend .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 2px;
        }
        #legend .legend-site {
            border: 0;
            padding: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            line-height: inherit;
            text-align: left;
            cursor: pointer;
        }
        #legend .legend-site:hover {
            text-decoration: underline;
        }
        #legend .legend-site:focus-visible {
            outline: 2px solid #1d4ed8;
            outline-offset: 2px;
        }
        #legend .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex: none;
            box-sizing: border-box;
        }
        #legend .legend-dot.confirmed {
            background: rgba(37,99,235,1.0);
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px rgba(37,99,235,0.7);
        }
        #legend .legend-dot.proposed {
            background: rgba(191,219,254,1.0);
            border: 3px dashed rgba(30,64,175,1.0);
        }
        #legend .legend-boundary {
            width: 22px;
            height: 0;
            flex: none;
            border-top: 3px solid rgba(90,98,108,1.0);
        }
        @media (max-width: 650px) {
            #legend {
                font-size: 12px;
                max-width: 62vw;
                max-height: 38vh;
                bottom: 44px;
            }
            #legend .legend-dot {
                width: 12px;
                height: 12px;
            }
            #popup-content {
                max-width: 85vw;
            }
        }
        </style>
        <title>호세아 시대의 역사적 장소들 / Historical Places of Hosea's Era</title>
    </head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
            <div id="legend">
                <div class="legend-title">장소 / Sites</div>
                <div class="legend-item"><span class="legend-boundary"></span><span>Northern Kingdom of Israel (approximate boundary) / 북이스라엘 왕국(경계 추정)</span></div>
                <div class="legend-item"><span class="legend-dot confirmed"></span><button type="button" class="legend-site" data-site-name="사마리아 유적 Samaria ruins" title="Click to show this site's popup">사마리아 유적 Samaria ruins</button></div>
                <div class="legend-item"><span class="legend-dot confirmed"></span><button type="button" class="legend-site" data-site-name="세겜 Shechem (Tell Balata)" title="Click to show this site's popup">세겜 Shechem (Tell Balata)</button></div>
                <div class="legend-item"><span class="legend-dot proposed"></span><button type="button" class="legend-site" data-site-name="디르사 Tirzah (추정 위치 / proposed site)" title="Click to show this site's popup">디르사 Tirzah (추정 위치 / proposed site)</button></div>
                <div class="legend-item"><span class="legend-dot confirmed"></span><button type="button" class="legend-site" data-site-name="베델 Bethel (현 베이틴 Baytin)" title="Click to show this site's popup">베델 Bethel (현 베이틴 Baytin)</button></div>
                <div class="legend-item"><span class="legend-dot confirmed"></span><button type="button" class="legend-site" data-site-name="단 Dan (텔 단 Tel Dan)" title="Click to show this site's popup">단 Dan (텔 단 Tel Dan)</button></div>
                <div class="legend-item"><span class="legend-dot confirmed"></span><button type="button" class="legend-site" data-site-name="텔 이즈르엘 Tel Jezreel" title="Click to show this site's popup">텔 이즈르엘 Tel Jezreel</button></div>
                <div class="legend-item"><span class="legend-dot confirmed"></span><button type="button" class="legend-site" data-site-name="예루살렘 Jerusalem" title="Click to show this site's popup">예루살렘 Jerusalem</button></div>
                <div class="legend-item"><span class="legend-dot confirmed"></span><button type="button" class="legend-site" data-site-name="레바논 산맥 / Mount Lebanon" title="Click to show this site's popup">레바논 산맥 / Mount Lebanon</button></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/HoseaSites_1.js"></script>
        <script src="styles/HoseaSites_1_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script>
        document.getElementById('legend').addEventListener('click', function (event) {
            var button = event.target.closest('button[data-site-name]');
            if (!button) {
                return;
            }
            event.preventDefault();
            event.stopPropagation();

            var siteName = button.getAttribute('data-site-name');
            var feature = jsonSource_HoseaSites_1.getFeatures().find(function (candidate) {
                return candidate.get('name') === siteName;
            });
            if (!feature) {
                console.error('Could not find map feature for legend entry:', siteName);
                return;
            }

            var coordinate = feature.getGeometry().getCoordinates();
            popupContent = '<ul><li><table><a><b>' +
                lyr_HoseaSites_1.get('popuplayertitle') + '</b></a>' +
                createPopupField(feature, feature.getKeys(), lyr_HoseaSites_1) +
                '</table></li></ul>';
            popupCoord = coordinate;
            map.getView().animate({center: coordinate, duration: 300});
            updatePopup();
        });

        // Photos finish loading after the popup opens and make it taller;
        // re-running the overlay position re-applies autoPan so the popup
        // stays fully inside the viewport.
        document.addEventListener('load', function (e) {
            if (e.target && e.target.tagName === 'IMG' && e.target.closest && e.target.closest('#popup-content') &&
                typeof overlayPopup !== 'undefined' && overlayPopup.getPosition()) {
                var p = overlayPopup.getPosition();
                overlayPopup.setPosition([p[0], p[1]]); // fresh array so the change event fires
            }
        }, true);
        </script>
    </body>
</html>
